# Desenvolvimento local — db + backend (reload) + frontend (hot-reload).
# Variáveis em infra/.env.dev, chamado explicitamente (env_file + --env-file):
#   docker compose --env-file infra/.env.dev -f infra/docker-compose.dev.yml up --build
# Também sobe sem --env-file (defaults inseguros embutidos, só para dev).
#
# Serviços:
#   db       -> localhost:5432 (postgres 16, user/pass default: login/senha)
#   backend  -> localhost:8000 (FastAPI, docs em /docs)
#   frontend -> localhost:3000 (Next.js dev)

name: proj-lab-eng-soft

services:
