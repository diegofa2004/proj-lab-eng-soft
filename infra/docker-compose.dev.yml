# Desenvolvimento: FastAPI + Next.js usando o PostgreSQL compartilhado.
# Na raiz do projeto:
#   ./scripts/dev-up.sh
# Ou definindo DATABASE_URL no ambiente, também a partir da raiz:
#   docker compose --env-file infra/.env.dev -f infra/docker-compose.dev.yml up --build

name: proj-lab-eng-soft

services:
  backend:
    build:
      context: ../backend
      target: development
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: ${DATABASE_URL:?configure DATABASE_URL in infra/.env.dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_SECRET_KEY_FILE: /run/livrusp-dev/jwt-secret
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../backend/app:/app/app
      - ../backend/scripts:/app/scripts
      - ../backend/alembic:/app/alembic
      - ../backend/alembic.ini:/app/alembic.ini
      - books-dev:/app/content
      - jwt-secret-dev:/run/livrusp-dev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ../frontend
      target: development
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Endereço para chamadas feitas pelo servidor Next.js dentro do Docker.
      BACKEND_URL: http://backend:8000
    command: ["pnpm", "exec", "next", "dev", "--hostname", "0.0.0.0"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules # preserva as dependências instaladas na imagem
      - /app/.next

volumes:
  books-dev:
  jwt-secret-dev:
