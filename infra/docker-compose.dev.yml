  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-login}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha}
  #     POSTGRES_DB: ${POSTGRES_DB:-pcs3443}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata-dev:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-login}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # backend:
  #   build:
  #     context: ../backend
  #     target: development
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   env_file:
  #     - .env.dev
  #   environment:
  #     DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-login}:${POSTGRES_PASSWORD:-senha}@db/${POSTGRES_DB:-pcs3443}
  #     JWT_SECRET_KEY: ${JWT_SECRET_KEY:-segredo-dev-troque-em-producao}
  #     BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000"]}
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ../backend/app:/app/app # hot-reload do código

  frontend:
    build:
      context: ../frontend
      target: development
    restart: unless-stopped
    # depends_on:
    #   - backend
    env_file:
      - .env.dev
    environment:
      # Dentro da rede do compose o backend se chama "backend".
      # O browser nunca fala com o backend direto: só com os Route Handlers /api/*.
      BACKEND_URL: http://backend:8000
      JWT_SECRET: ${JWT_SECRET_KEY:-segredo-dev-troque-em-producao}
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules # preserva os bins instalados no build
      - /app/.next

volumes:
  pgdata-dev: