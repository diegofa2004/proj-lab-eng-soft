services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: livrusp
      POSTGRES_USER: livrusp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livrusp -d livrusp"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      target: production
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - books:/app/content
volumes:
  database:
  books:
